<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">From saved content to useful context</title><desc id="desc">A browser-native retrieval loop. An optional backend extends the collection.</desc>

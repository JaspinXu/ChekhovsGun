<text x="44" y="665" font-size="17" fill="#163244" font-weight="600">Platform APIs · subtitles · comments · Whisper*</text>
<text x="44" y="693" font-size="16" fill="#637481" font-weight="400">Independent SQLite library + retrieval</text>

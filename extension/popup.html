<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>ChekhovsGun</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 296px; margin: 0; padding: 15px;
    font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #14171f; color: #e9ebf1;
  }
  @media (prefers-color-scheme: light) { body { background: #fffdf9; color: #1b1d22; } }
  h1 { font-size: 14.5px; margin: 0 0 2px; display: flex; align-items: center; gap: 7px; }
  .mark { width: 9px; height: 9px; border-radius: 50%; background: #e0a458;
          box-shadow: 0 0 0 3px rgba(224,164,88,.18); }
  .sub { font-size: 11.5px; opacity: .55; margin: 0 0 13px; }

  .primary {
    display: block; width: 100%; padding: 10px; margin-bottom: 8px;
    border: 0; border-radius: 10px; background: #e0a458; color: #17130c;
    font: inherit; font-weight: 650; font-size: 13.5px; cursor: pointer;
  }
  .primary:hover { filter: brightness(1.06); }
  .primary:disabled { opacity: .55; cursor: default; filter: none; }
  .secondary {
    display: block; width: 100%; padding: 9px; margin-bottom: 10px;
    border: 1px solid rgba(224,164,88,.45); border-radius: 10px;
    background: transparent; color: #e0a458; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .secondary:hover { background: rgba(224,164,88,.12); }

  .progress { margin: 12px 0 4px; }
  .bar { height: 5px; border-radius: 99px; background: rgba(128,128,128,.22); overflow: hidden; }
  .bar i { display: block; height: 100%; background: #e0a458; border-radius: 99px;
           transition: width .4s ease; }
  .legend { display: flex; justify-content: space-between; font-size: 11.5px;
            opacity: .65; margin-top: 6px; }
  .legend b { font-variant-numeric: tabular-nums; }

  .note { margin: 10px 0 0; padding: 9px 11px; border-radius: 9px; font-size: 11.5px;
          line-height: 1.5; background: rgba(128,128,128,.12); }
  .note.bad { background: rgba(255,75,75,.14); color: #ff9b9b; }
  .note.warm { background: rgba(224,164,88,.14); }

  .rows { margin-top: 12px; border-top: 1px solid rgba(128,128,128,.16); }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 12.5px; }
  .row + .row { border-top: 1px solid rgba(128,128,128,.12); }
  .row label { flex: 1; cursor: pointer; }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: #e0a458; cursor: pointer; }

  .links { display: flex; gap: 14px; margin-top: 13px; font-size: 12px; }
  .links a { color: #e0a458; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1><span class="mark"></span>ChekhovsGun</h1>
  <p class="sub">只需要收藏，剩下的交给它</p>

  <button class="primary" id="capture">收进 ChekhovsGun</button>
  <button class="secondary" id="scan" hidden>把这个收藏夹整个收进来</button>

  <div class="progress" id="progress" hidden>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="legend">
      <span>已学完 <b id="digested">0</b> / <b id="items">0</b></span>
      <span id="pending"></span>
    </div>
  </div>

  <div class="note" id="note">正在读取本地索引…</div>

  <div class="rows">
    <div class="row"><label for="enabled">刷到相关内容时提醒我</label><input type="checkbox" id="enabled" /></div>
    <div class="row"><label for="captureOnSave">点网站的「收藏」时自动收进来</label><input type="checkbox" id="captureOnSave" /></div>
  </div>

  <div class="links">
    <a id="dashboard" href="#" target="_blank" rel="noopener" hidden>打开本地服务</a>
    <a id="options" href="#">全部设置</a>
  </div>
<script src="popup.js"></script>
</body>
</html>

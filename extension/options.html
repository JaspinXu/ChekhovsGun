<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>ChekhovsGun 设置</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 560px; margin: 40px auto; padding: 0 20px;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0d0f14; color: #e8eaf0; }
  @media (prefers-color-scheme: light) { body { background: #f7f6f3; color: #1c1d21; } }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { opacity: .6; font-size: 13px; margin-top: 0; }
  fieldset { border: 1px solid rgba(128,128,128,.28); border-radius: 12px; padding: 16px 18px; margin: 18px 0; }
  legend { padding: 0 6px; font-size: 13px; opacity: .75; }
  label { display: block; margin: 12px 0 5px; font-size: 13.5px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 8px 11px; border-radius: 8px; font: inherit; font-size: 14px;
    border: 1px solid rgba(128,128,128,.35); background: rgba(128,128,128,.08); color: inherit;
  }
  .hint { font-size: 12px; opacity: .55; margin: 4px 0 0; }
  .check { display: flex; align-items: center; gap: 9px; margin: 10px 0; }
  .check input { width: 16px; height: 16px; accent-color: #e0a458; }
  button { margin-top: 6px; padding: 9px 20px; border-radius: 9px; border: 0;
           background: #e0a458; color: #17130c; font: inherit; font-weight: 600; cursor: pointer; }
  #saved { margin-left: 12px; font-size: 13px; color: #56c271; opacity: 0; transition: opacity .2s; }
  #saved.show { opacity: 1; }
</style>
</head>
<body>
  <h1>ChekhovsGun 设置</h1>
  <p class="sub">扩展只会访问你本机上的 ChekhovsGun 服务，不会把观看记录发到任何别的地方。</p>

  <fieldset>
    <legend>本地服务</legend>
    <label for="serverUrl">服务地址</label>
    <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8700" />
    <p class="hint">默认由 <code>chekhovsgun serve</code> 启动在 8700 端口。</p>
  </fieldset>

  <fieldset>
    <legend>提醒行为</legend>
    <div class="check"><input type="checkbox" id="enabled" /><label for="enabled">启用提醒</label></div>
    <div class="check"><input type="checkbox" id="youtube" /><label for="youtube">在 YouTube 上启用</label></div>
    <div class="check"><input type="checkbox" id="bilibili" /><label for="bilibili">在 Bilibili 上启用</label></div>
    <div class="check"><input type="checkbox" id="explain" /><label for="explain">生成解读（未配置 LLM 时自动降级为原文摘录）</label></div>
    <div class="check"><input type="checkbox" id="autoCollapse" /><label for="autoCollapse">默认折叠卡片</label></div>

    <label for="cooldownMinutes">同一个视频的冷却时间（分钟）</label>
    <input type="number" id="cooldownMinutes" min="0" max="1440" />
    <p class="hint">在冷却时间内重复刷到同一个视频不会再弹出。</p>

    <label for="maxItems">最多显示几条收藏</label>
    <input type="number" id="maxItems" min="1" max="10" />
  </fieldset>

  <button id="save">保存</button><span id="saved">已保存</span>
<script src="options.js"></script>
</body>
</html>

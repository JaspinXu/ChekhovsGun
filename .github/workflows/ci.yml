name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint
        run: ruff check chekhovsgun tests scripts packaging

      - name: Test
        run: pytest -q

      - name: Smoke test the CLI end to end
        run: |
          export CHEKHOVSGUN_HOME="$RUNNER_TEMP/chekhovsgun"
          python -m chekhovsgun demo
          python -m chekhovsgun status
          python -m chekhovsgun search "RAG 分块"
          # comment-only facts must be retrievable, and marking must stick
          python -m chekhovsgun search "FlashAttention 复杂度"
          python -m chekhovsgun mark "https://www.bilibili.com/video/BV1xx411c7mD" --digested
          python -m chekhovsgun items --status digested

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          npm install
          pip install -e .

      - name: Test the in-browser engine
        run: npm test

      # The JavaScript engine is a port of the Python one, held to it by
      # fixtures captured from the real Python functions. Regenerating them and
      # finding a diff means the two have drifted apart — which would show up in
      # production as quietly worse retrieval rather than as a failure.
      - name: Check the port has not drifted from Python
        run: |
          python scripts/gen_fixtures.py
          git diff --exit-code extension/test/

      - name: Package
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip

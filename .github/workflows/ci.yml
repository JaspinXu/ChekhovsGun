name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint
        run: ruff check chekhovsgun tests scripts packaging

      - name: Test
        run: pytest -q

      - name: Smoke test the CLI end to end
        run: |
          export CHEKHOVSGUN_HOME="$RUNNER_TEMP/chekhovsgun"
          python -m chekhovsgun demo
          python -m chekhovsgun status
          python -m chekhovsgun search "RAG 分块"
          # comment-only facts must be retrievable, and marking must stick
          python -m chekhovsgun search "FlashAttention 复杂度"
          python -m chekhovsgun mark "https://www.bilibili.com/video/BV1xx411c7mD" --digested
          python -m chekhovsgun items --status digested

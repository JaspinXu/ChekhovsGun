[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chekhovsgun"
version = "0.2.0"
description = "Every bookmark must fire — local RAG over what you saved on YouTube and Bilibili."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JaspinXu" }]
keywords = ["rag", "bookmarks", "youtube", "bilibili", "retrieval", "learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "numpy>=1.24",
  "httpx>=0.25",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
# Better YouTube caption coverage — it tracks YouTube's changes for us.
youtube = ["youtube-transcript-api>=0.6"]
# A real multilingual encoder; strongly recommended for mixed zh/en libraries.
neural = ["sentence-transformers>=2.2"]
# Local speech-to-text for videos that ship no subtitles at all.
whisper = ["faster-whisper>=1.0", "yt-dlp>=2024.1"]
# Background tray runner — no terminal needed.
tray = ["pystray>=0.19", "Pillow>=10.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = [
  "youtube-transcript-api>=0.6",
  "sentence-transformers>=2.2",
  "faster-whisper>=1.0",
  "yt-dlp>=2024.1",
  "pystray>=0.19",
  "Pillow>=10.0",
]

[project.scripts]
chekhovsgun = "chekhovsgun.cli:main"

[project.urls]
Homepage = "https://github.com/JaspinXu/ChekhovsGun"
Issues = "https://github.com/JaspinXu/ChekhovsGun/issues"

[tool.setuptools.packages.find]
include = ["chekhovsgun*"]

[tool.setuptools.package-data]
chekhovsgun = ["data/*.json", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # long lines are handled by the formatter, not by hand
  "UP035",   # typing.Sequence etc. stay importable on the supported versions
  "B008",    # FastAPI dependencies are function calls in defaults by design
  "SIM105",  # contextlib.suppress is not clearer for one-line best-effort paths
  "RUF001", "RUF002", "RUF003",  # this codebase is intentionally bilingual
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
